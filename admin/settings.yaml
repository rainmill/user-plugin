# Settings > Users: how users sign in, register and become active.
code: rainmill.user.settings
label: Users
description: "Sign-in, registration and activation for the application's users."
category: Users
icon: users
permission: rainmill.user.settings
fields:
  login_attribute:
    type: select
    label: Sign in with
    help: The attribute a user types to sign in. It must be unique.
    options:
      - { value: email, label: Email address }
      - { value: username, label: Username }
      - { value: phone, label: Phone number }
  allow_registration: { type: switch }
  activation:
    type: select
    options:
      - { value: automatic, label: Automatic }
      - { value: user, label: The user confirms a code }
      - { value: operator, label: An operator approves the account }
  block_persistence: { type: switch, label: One session at a time }
  soft_delete:       { type: switch, label: Keep deleted users restorable }
  guests:            { type: switch, label: Allow guest users }
  notify_user:       { type: switch, label: Send new users a welcome message }
  notify_operators:  { type: switch, label: Tell operators about new users }
  token_hours:
    label: Code validity (hours)
    help: How long an activation code or password reset link works.
