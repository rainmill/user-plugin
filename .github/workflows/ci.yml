name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Laterite crates resolve from crates.io, so the plugin builds, lints and
# tests standalone. The test suite runs the portable migrations on SQLite; the
# application workspace that consumes the plugin covers PostgreSQL.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
